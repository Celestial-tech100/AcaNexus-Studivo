<!doctype html>
<html>
  <head>
    <title>Login - AcaNexus</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}"
    />
  </head>

  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <h1>Welcome Back</h1>
          <p>Login to continue to AcaNexus</p>
        </div>

        <form method="POST" class="auth-form">
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          />

          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />

          <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="auth-footer">
          Don't have an account?

          <a href="/register"> Register </a>
        </p>
      </div>
    </div>
  </body>
</html>

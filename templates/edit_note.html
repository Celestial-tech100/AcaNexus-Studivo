{% extends "base.html" %} {% block content %}

<div class="page-header">
  <h1>Edit Note</h1>
  <p>Update your note information</p>
</div>

<div class="notes-control-card">
  <form method="POST" class="note-form">
    <input type="text" name="title" value="{{ note[1] }}" required />

    <textarea name="content" rows="8" required>{{ note[2] }}</textarea>

    <button type="submit" class="btn btn-gold">Update Note</button>
  </form>
</div>

{% endblock %}

{% extends "base.html" %} {% block content %}

<div class="auth-container">
  <div class="auth-card">
    <h1>Edit Note</h1>

    <form method="POST" class="auth-form">
      <input type="text" name="title" value="{{ note[2] }}" required />

      <textarea name="content" rows="10" required>{{ note[3] }}</textarea>

      <button type="submit" class="btn btn-gold">Save Changes</button>
    </form>
  </div>
</div>

{% endblock %}
